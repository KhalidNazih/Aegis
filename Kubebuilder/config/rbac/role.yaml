---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - security.aegis.io
  resources:
  - aiworkloadpolicies
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - security.aegis.io
  resources:
  - aiworkloadpolicies/finalizers
  verbs:
  - update
- apiGroups:
  - security.aegis.io
  resources:
  - aiworkloadpolicies/status
  verbs:
  - get
  - patch
  - update
